[package]
name = "rscan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
rscan-config = { path = "../config" }
rscan-core = { path = "../core" }
rscan-output = { path = "../output" }

[dev-dependencies]
hex = "0.4.3"
russh = "0.60.1"
rustls = "0.23.38"
rustls-pemfile = "2.2.0"
serde_json.workspace = true
tokio = { version = "1.52.1", features = ["net", "rt-multi-thread", "time"] }

[[bin]]
name = "rscan"
path = "src/main.rs"
