[package]
name = "rscan-plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8.4"
anyhow.workspace = true
base64 = "0.22.1"
cbc = "0.1.2"
des = "0.8.1"
hex = "0.4.3"
md5 = "0.7.0"
oracle-rs = "0.1.7"
rdp-rs = "0.1.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "gzip", "rustls-tls"] }
rustls = "0.23.38"
serde_json.workspace = true
sha1 = "0.10.6"
smb2 = "0.7.2"
ssh2 = "0.9.5"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
russh = "0.60.1"
rustls-pemfile = "2.2.0"
