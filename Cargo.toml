[workspace]
members = [
    "cli",
    "config",
    "core",
    "fingerprint",
    "net",
    "output",
    "platform",
    "plugins",
    "poc",
    "web",
]
default-members = ["cli"]
resolver = "3"

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
csv = "1.4.0"
hex = "0.4.3"
regex = "1.12.2"
reqwest = { version = "0.12.24", default-features = false }
russh = "0.60.1"
rustls = "0.23.38"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "1.3.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "local-offset"] }
tokio = "1.52.1"
# Dev-only: criterion is declared as a workspace dependency so crates can opt
# into benchmarks via `criterion = { workspace = true }` in `[dev-dependencies]`.
criterion = "0.5"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
smb2 = { path = "vendor/smb2" }
