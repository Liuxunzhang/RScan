[workspace]
members = [
    "cli",
    "config",
    "core",
    "fingerprint",
    "net",
    "output",
    "platform",
    "plugins",
    "poc",
    "web",
]
default-members = ["cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.100"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
shlex = "1.3.0"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "local-offset"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
oracle-rs = { path = "vendor/oracle-rs" }
smb2 = { path = "vendor/smb2" }
